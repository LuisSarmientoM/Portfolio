name: Deploy Portfolio

on:
  push:
    branches:
      - main
    paths:
      - "apps/portfolio/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check portfolio
        run: pnpm --filter @sites/portfolio check

      - name: Build portfolio
        run: pnpm --filter @sites/portfolio build
        env:
          PUBLIC_BLOG_URL: ${{ vars.PUBLIC_BLOG_URL }}
          PUBLIC_CONTACT_API_URL: ${{ vars.PUBLIC_CONTACT_API_URL }}

      - name: Deploy portfolio to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/portfolio/dist
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_PORTFOLIO }}
            --branch=main
