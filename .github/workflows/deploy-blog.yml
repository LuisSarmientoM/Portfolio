name: Deploy Blog

on:
  push:
    branches:
      - main
    paths:
      - "apps/blog/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check blog
        run: pnpm --filter @sites/blog check

      - name: Build blog
        run: pnpm --filter @sites/blog build
        env:
          PUBLIC_PORTFOLIO_URL: ${{ vars.PUBLIC_PORTFOLIO_URL }}

      - name: Deploy blog to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/blog/dist
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_BLOG }}
            --branch=main
